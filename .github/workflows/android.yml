name: Android APK

on:
  push:
    branches: [android-app, android-release]
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versi aplikasi
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/android-v}"
            echo "PUBLISH=1" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF}" == refs/heads/android-release ]]; then
            NAME="$(tr -d ' \n\r' < VERSION)"
            echo "PUBLISH=1" >> "$GITHUB_ENV"
          else
            NAME="1.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "APP_VERSION_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Siapkan keystore rilis
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum ada, APK ditandatangani dengan kunci debug."
          fi

      - name: Build APK rilis
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Ganti nama APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SISFOPERSKC-${APP_VERSION_NAME}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: SISFOPERSKC-${{ env.APP_VERSION_NAME }}
          path: android/out/*.apk

      - name: Terbitkan GitHub Release
        if: env.PUBLISH == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.APP_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: SISFOPERS KC Android ${{ env.APP_VERSION_NAME }}
          body_path: android/RELEASE_NOTES.md
          files: android/out/*.apk
