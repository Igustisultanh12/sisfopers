name: Android Screenshots

on:
  workflow_dispatch:
  push:
    branches: [android-screenshots]

permissions:
  contents: write

concurrency:
  group: android-screenshots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build demo APK
        env:
          SISFOPERS_DEMO: '1'
          APP_VERSION_NAME: '1.0.0'
          APP_VERSION_CODE: '100'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: android
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            bash screenshots/capture.sh ../shots-out

      - name: Publish screenshots branch
        working-directory: .
        run: |
          ls shots-out | head -100
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan shots-tmp
          git rm -rf -q . >/dev/null
          mkdir -p screenshots && cp shots-out/*.png screenshots/
          git add screenshots
          git commit -qm "Screenshots ${GITHUB_SHA}"
          git push -f origin shots-tmp:android-screenshots-out
